name: openForm Web (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Web-Modus ohne Demo-Beispieldaten
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          f = Path("frontend/src/store/useStore.js")
          s = f.read_text()
          s, n = re.subn(r"        if \(!localStorage\.getItem\(DEMO_SEEDED\)\) \{\s*localStorage\.setItem\(DEMO_SEEDED, '1'\)\s*await get\(\)\.resetDemo\(\)\s*\}", "        // openForm Web: Browserprofil ohne Demo-Daten", s, count=1)
          if n != 1:
              raise SystemExit("Demo-Bootstrap geändert: Build gestoppt")
          f.write_text(s)
          PY
      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci
      - name: Web-App bauen
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: npm run build
      - name: Prüfen und .nojekyll anlegen
        run: |
          test -s frontend/dist/index.html
          touch frontend/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
